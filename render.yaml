services:
  - type: web
    name: gestor-mei-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://gestor-mei.vercel.app","https://gestor-mei-beta.vercel.app","https://gestormei.com.br","https://www.gestormei.com.br"]'
      - key: SEED_DATABASE
        value: "false"
      - key: MEI_DEFAULT_ANNUAL_LIMIT
        value: "81000.00"
      - key: MASTER_NAME
        value: "Leonidas Paulino (MASTER)"
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false

